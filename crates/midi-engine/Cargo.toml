[package]
name = "virtual-midi-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
cc = "1.2"

[lib]
name = "virtual_midi_engine"

[[bin]]
name = "virtual-midi-engine"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
virtual-midi-core = { path = "../midi-core" }
virtual-midi-platform = { path = "../midi-platform" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(target_os = "macos")'.dev-dependencies]
midir = "0.10"
