name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build macOS package
        run: ./scripts/package-macos.sh
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: virtual-midi-master-macos-universal
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: virtual-midi-master-windows-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  release:
    name: Publish GitHub release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Virtual MIDI Master $GITHUB_REF_NAME" --generate-notes
